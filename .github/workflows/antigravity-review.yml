name: Antigravity Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Requerido para que el agente tenga acceso al diff completo

      - name: Run Antigravity Review Agent
        uses: anguillanneuf/run-antigravity-cli@126f1bc7865cbcf3784cf764c96d3eb7f4d0b5d9
        with:
          api-key: ${{ secrets.GEMINI_API_KEY }}